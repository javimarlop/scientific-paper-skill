# GitHub Actions workflow for the repository of a PAPER (not of this skill): checks the bibliography with
# check_dois.py every time a .bib file changes, with no AI involved.
#
# To use it, in the paper's repository:
#   mkdir -p .github/workflows scripts
#   cp <skill>/scripts/check_dois.py scripts/
#   cp <skill>/scripts/check-refs.yml .github/workflows/
# and set BIB below to the path of the bibliography.
#
# The job fails if a DOI does not resolve, points to a retracted or withdrawn work, is a notice instead of the work,
# or does not match the title or year of its entry. Read the log: it prints what each DOI is.

name: check references

on:
  push:
    paths: ['**.bib', 'scripts/check_dois.py', '.github/workflows/check-refs.yml']
  pull_request:
    paths: ['**.bib', 'scripts/check_dois.py', '.github/workflows/check-refs.yml']
  workflow_dispatch:

env:
  BIB: refs.bib

jobs:
  dois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check DOIs against Crossref and DataCite
        run: python scripts/check_dois.py --bib "$BIB"
